services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    ports: ["5432:5432"]
    volumes: [helpdesk_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/helpdesk
      DB_USERNAME: helpdesk
      DB_PASSWORD: helpdesk
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  helpdesk_data: